<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kuma — Plateforme d'automatisation de génération de contrats pour prestataires de services." />
    <meta name="theme-color" content="#0369A1" />
    <title>Kuma — Génération de contrats</title>
    <script>
      // Applique le thème avant le premier rendu : évite le flash de fond
      // clair pour les utilisateurs en thème sombre.
      (function () {
        try {
          var stored = localStorage.getItem('kuma_theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
