databases:
  - name: kuma-db
    databaseName: kuma
    user: kuma
    plan: free

services:
  - type: web
    name: kuma-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kuma-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: ALGORITHM
        value: HS256
      - key: STORAGE_PATH
        value: /app/storage/contracts
      - key: STORAGE_ENCRYPTION_KEY
        sync: false
      - key: YOUSIGN_API_URL
        value: https://api-sandbox.yousign.app/v3
      - key: YOUSIGN_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://kuma-frontend.onrender.com
      - key: ENVIRONMENT
        value: production
      # Cree automatiquement le premier compte admin au demarrage (pas de Shell sur le plan free).
      # Une fois le compte cree, tu peux vider ADMIN_PASSWORD dans le dashboard Render.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_FULL_NAME
        value: Administrateur

  - type: web
    name: kuma-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://kuma-backend.onrender.com
